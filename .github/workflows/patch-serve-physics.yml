name: One-shot serve physics patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot serve physics patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix serve flight physics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text()
          old = "ball.vel.y -= 9.81 * sdt; ball.vel.x += ball.spin.y * ball.vel.z * 0.00082; ball.spin.multiplyScalar(0.999); ball.pos.addScaledVector(ball.vel, sdt);"
          new = "ball.vel.y -= 9.81 * sdt; ball.vel.x += ball.spin.y * ball.vel.z * 0.014 * sdt; ball.spin.multiplyScalar(0.999); ball.pos.addScaledVector(ball.vel, sdt);"
          if old not in s:
              raise SystemExit('Expected physics line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-serve-physics.yml
          git add src/main.js
          git commit -m "Fix serve flight physics"
          git push
