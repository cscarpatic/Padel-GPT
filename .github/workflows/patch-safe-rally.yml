name: One-shot safe rally trajectory patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot safe rally trajectory patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch rally trajectory engine
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.js')
          text = path.read_text()

          old_import = "import { MatchScore } from './scoring.js';\n"
          new_import = "import { MatchScore } from './scoring.js';\nimport { computeSafeRallyVelocity } from './physics.js';\n"
          if "computeSafeRallyVelocity" not in text:
              if old_import not in text:
                  raise SystemExit('MatchScore import not found')
              text = text.replace(old_import, new_import, 1)

          old_fn = """function launchTowards(target, horizontalSpeed, lift, hitter) {
            const d = target.clone().sub(ball.pos); d.y = 0; d.normalize(); ball.vel.set(d.x * horizontalSpeed, lift, d.z * horizontalSpeed);
            ball.spin.set((Math.random() - 0.5) * 4, 8 * (hitter === 'player' ? 1 : -1), -ball.vel.x * 0.62); recordShotSpeed();
          }"""
          new_fn = """function launchTowards(target, horizontalSpeed, lift, hitter) {
            const { velocity } = computeSafeRallyVelocity({
              start: ball.pos,
              target,
              horizontalSpeed,
              liftHint: lift,
              netHeight: COURT.netH,
              ballRadius: ball.radius
            });
            ball.vel.set(velocity.x, velocity.y, velocity.z);
            ball.spin.set((Math.random() - 0.5) * 3.2, 3.5 * (hitter === 'player' ? 1 : -1), -ball.vel.x * 0.42);
            recordShotSpeed();
          }"""
          if old_fn not in text:
              raise SystemExit('launchTowards function not found; aborting safely')
          text = text.replace(old_fn, new_fn, 1)
          path.write_text(text)
          PY
      - name: Run simulation and full checks
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/physics.js tests/physics.test.js
          git rm .github/workflows/patch-safe-rally.yml
          git commit -m "Fix rally trajectories with headless simulation"
          git push
