name: One-shot serve trajectory patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-serve.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch serve trajectory
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.js')
          source = path.read_text()
          old = "launchBallistic(target, 0.72, s.server, 4.5);"
          new = "launchBallistic(target, 0.78, s.server, 4.5);"

          if old not in source:
              raise SystemExit('Expected serve trajectory line not found')

          path.write_text(source.replace(old, new, 1))
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-serve.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js .github/workflows/patch-serve.yml
          git commit -m "Fix serve trajectory"
          git push origin HEAD:main
