name: Validated flat CPU serve update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flat-cpu-serve.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/flat_serve_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate project
        run: npm run check
      - name: Verify flat CPU serve
        run: node .github/scripts/verify_flat_cpu_serve.mjs
      - name: Commit validated update
        run: |
          git config user.name "cscarpatic"
          git config user.email "146448687+cscarpatic@users.noreply.github.com"
          git add src/main.js
          git commit -m "Flatten CPU serve trajectory"
          git push
