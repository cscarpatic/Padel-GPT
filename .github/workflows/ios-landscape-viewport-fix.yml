name: Validated iOS landscape viewport fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-landscape-viewport-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply robust iOS landscape viewport fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('src/main.js')
          text = main.read_text()

          old = "function animate() {\n  requestAnimationFrame(animate); const dt = Math.min(clock.getDelta(), 0.033);\n  pollGamepad();"
          new = "function animate() {\n  requestAnimationFrame(animate); const dt = Math.min(clock.getDelta(), 0.033);\n  const viewport = getViewportDimensions();\n  const expectedAspect = viewport.width / viewport.height;\n  if (Math.abs(camera.aspect - expectedAspect) > 0.015 || canvas.clientWidth !== viewport.width || canvas.clientHeight !== viewport.height) resizeRenderer();\n  pollGamepad();"
          if old not in text: raise SystemExit('animate target missing')
          text = text.replace(old, new, 1)

          old = "function resizeRenderer() {\n  if (!renderer || !camera || !composer) return; camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight);\n}"
          new = "function getViewportDimensions() {\n  const root = document.documentElement;\n  const width = Math.max(1, Math.round(root.clientWidth || window.innerWidth || 1));\n  const height = Math.max(1, Math.round(root.clientHeight || window.innerHeight || 1));\n  return { width, height };\n}\n\nfunction resizeRenderer() {\n  if (!renderer || !camera || !composer) return;\n  const { width, height } = getViewportDimensions();\n  camera.aspect = width / height;\n  camera.updateProjectionMatrix();\n  renderer.setSize(width, height, true);\n  renderer.setViewport(0, 0, width, height);\n  composer.setSize(width, height);\n  canvas.style.width = `${width}px`;\n  canvas.style.height = `${height}px`;\n}\n\nfunction scheduleRendererResize() {\n  [0, 80, 180, 360, 700].forEach((delay) => setTimeout(resizeRenderer, delay));\n}"
          if old not in text: raise SystemExit('resize target missing')
          text = text.replace(old, new, 1)

          old = "function setupEvents() {\n  addEventListener('resize', resizeRenderer);"
          new = "function setupEvents() {\n  addEventListener('resize', scheduleRendererResize);\n  addEventListener('orientationchange', scheduleRendererResize);\n  visualViewport?.addEventListener('resize', scheduleRendererResize);\n  visualViewport?.addEventListener('scroll', scheduleRendererResize);\n  screen.orientation?.addEventListener?.('change', scheduleRendererResize);"
          if old not in text: raise SystemExit('setupEvents target missing')
          text = text.replace(old, new, 1)

          old = "  try { await screen.orientation?.lock?.('landscape'); } catch {}\n  setTimeout(() => window.scrollTo(0, 1), 60);\n}"
          new = "  try { await screen.orientation?.lock?.('landscape'); } catch {}\n  setTimeout(() => window.scrollTo(0, 1), 60);\n  scheduleRendererResize();\n}"
          if old not in text: raise SystemExit('immersive target missing')
          text = text.replace(old, new, 1)
          main.write_text(text)

          style = Path('src/style.css')
          css = style.read_text()
          targets = [
            ("html,body{margin:0;width:100%;height:100%;min-height:100dvh;overflow:hidden;overscroll-behavior:none;", "html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;overscroll-behavior:none;"),
            ("body{position:fixed;inset:0;width:100dvw;height:100dvh;user-select:none;", "body{position:fixed;inset:0;width:auto;height:auto;user-select:none;"),
            ("#game{position:fixed;inset:0;width:100dvw;height:100dvh;display:block;touch-action:none;background:#07131d}", "#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#07131d}"),
            ("@supports(height:100dvh){html,body,#game,.screen,#hud{height:100dvh}}", "@supports(height:100dvh){html,body,#game,.screen,#hud{height:100%}}")
          ]
          for old, new in targets:
            if old not in css: raise SystemExit('CSS target missing: ' + old[:50])
            css = css.replace(old, new, 1)
          style.write_text(css)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate tests and build
        run: npm run check

      - name: Verify viewport fix
        run: |
          grep -F "function getViewportDimensions()" src/main.js
          grep -F "addEventListener('orientationchange', scheduleRendererResize)" src/main.js
          grep -F "visualViewport?.addEventListener('resize', scheduleRendererResize)" src/main.js
          grep -F "renderer.setViewport(0, 0, width, height)" src/main.js
          grep -F "canvas.clientWidth !== viewport.width" src/main.js
          grep -F "body{position:fixed;inset:0;width:auto;height:auto" src/style.css
          grep -F "#game{position:fixed;inset:0;width:100%;height:100%" src/style.css

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/style.css
          git commit -m "Fix iOS landscape renderer sizing"
          git push
