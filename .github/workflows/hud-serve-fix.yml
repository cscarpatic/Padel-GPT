name: Validated HUD and CPU serve update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hud-serve-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/hud_serve_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate project
        run: npm run check
      - name: Validate CPU serve profile
        run: node .github/scripts/verify_cpu_serve.mjs
      - name: Verify HUD placement
        run: grep -q "right:var(--safe-right);left:auto;transform:none" src/style.css
      - name: Commit validated update
        run: |
          git config user.name "cscarpatic"
          git config user.email "146448687+cscarpatic@users.noreply.github.com"
          git add src/main.js src/style.css .github/scripts/verify_cpu_serve.mjs
          git commit -m "Move mobile status HUD and flatten CPU serve"
          git push
