name: Validated visual clarity and HUD fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-clarity-hud.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply visual clarity and HUD fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('src/main.js')
          text = main.read_text()
          replacements = [
            ("if (bloomPass) bloomPass.enabled = q.bloom && !reducedMotion;",
             "if (bloomPass) bloomPass.enabled = q.bloom && !reducedMotion && !coarsePointer;"),
            ("uniforms: { top: { value: new THREE.Color(0x82d5ff) }, bottom: { value: new THREE.Color(0xeaf8ff) } },",
             "uniforms: { top: { value: new THREE.Color(0x62bce8) }, bottom: { value: new THREE.Color(0xbaddec) } },"),
            ("const arenaGround = new THREE.Mesh(new THREE.CircleGeometry(58, 64), mat(0xd7ecf8, 1));",
             "const arenaGround = new THREE.Mesh(new THREE.CircleGeometry(58, 64), mat(0x78b8cf, 0.94));"),
            ("const slab = new THREE.Mesh(new THREE.BoxGeometry(12.6, 0.28, 22.7), mat(0xf4f9fc, 0.72, 0.03));",
             "const slab = new THREE.Mesh(new THREE.BoxGeometry(12.6, 0.28, 22.7), mat(0xc8dce6, 0.76, 0.02));"),
            ("scene.add(new THREE.HemisphereLight(0xdaf5ff, 0xd5e6ef, 1.78));",
             "scene.add(new THREE.HemisphereLight(0xc8edff, 0x78909d, 0.72));"),
            ("keyLight = new THREE.DirectionalLight(0xffffff, 2.85);",
             "keyLight = new THREE.DirectionalLight(0xffffff, 1.08);"),
            ("const spot = new THREE.SpotLight(index < 2 ? 0xbfeaff : 0xffffff, 78, 38, Math.PI / 5, 0.45, 1.1);",
             "const spot = new THREE.SpotLight(index < 2 ? 0xbfeaff : 0xffffff, 11, 34, Math.PI / 5, 0.45, 1.1);"),
            ("renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.94;",
             "renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = coarsePointer ? 0.68 : 0.82;"),
            ("bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.14, 0.28, 0.94);",
             "bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.05, 0.12, 0.98);")
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Missing main.js target: {old}')
            text = text.replace(old, new, 1)
          main.write_text(text)

          style = Path('src/style.css')
          css = style.read_text()
          old_score = ".scoreboard{position:absolute;left:50%;top:var(--safe-top);transform:translateX(-50%);display:flex;align-items:stretch;min-width:310px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px) saturate(1.2);border-radius:14px;overflow:hidden;box-shadow:0 12px 40px #0007}"
          new_score = ".scoreboard{position:absolute;left:var(--safe-left);top:var(--safe-top);transform:none;display:flex;align-items:stretch;min-width:244px;max-width:286px;border:1px solid rgba(255,255,255,.16);background:rgba(7,16,20,.74);backdrop-filter:blur(10px) saturate(1.08);-webkit-backdrop-filter:blur(10px) saturate(1.08);border-radius:14px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.28)}"
          old_stick = ".stick{pointer-events:auto;position:relative;width:202px;height:202px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:radial-gradient(circle at 50% 50%,rgba(200,255,52,.09) 0 20%,rgba(255,255,255,.07) 21% 36%,rgba(5,13,17,.78) 37% 100%);box-shadow:0 18px 48px rgba(0,0,0,.34),inset 0 0 36px rgba(255,255,255,.055),0 0 30px rgba(200,255,52,.06);backdrop-filter:blur(14px);touch-action:none}"
          new_stick = ".stick{pointer-events:auto;position:relative;width:202px;height:202px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.035) 0 20%,rgba(255,255,255,.022) 21% 36%,rgba(5,13,17,.14) 37% 100%);box-shadow:0 8px 24px rgba(0,0,0,.14),inset 0 0 18px rgba(255,255,255,.025);backdrop-filter:none;-webkit-backdrop-filter:none;touch-action:none}"
          old_knob = ".stick i{position:absolute;left:50%;top:50%;width:82px;height:82px;margin:-41px;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.38),rgba(255,255,255,.11) 58%,rgba(200,255,52,.08));border:1px solid rgba(230,255,157,.32);box-shadow:0 12px 32px rgba(0,0,0,.34),0 0 24px rgba(200,255,52,.09);transform:translate(0,0)}"
          new_knob = ".stick i{position:absolute;left:50%;top:50%;width:82px;height:82px;margin:-41px;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.24),rgba(255,255,255,.075) 58%,rgba(200,255,52,.035));border:1px solid rgba(255,255,255,.16);box-shadow:0 7px 18px rgba(0,0,0,.2);transform:translate(0,0)}"
          for old, new in [(old_score,new_score),(old_stick,new_stick),(old_knob,new_knob)]:
            if old not in css:
              raise SystemExit(f'Missing style.css target: {old[:80]}')
            css = css.replace(old, new, 1)
          style.write_text(css)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate tests and production build
        run: npm run check

      - name: Verify requested fixes
        run: |
          grep -F "bloomPass.enabled = q.bloom && !reducedMotion && !coarsePointer" src/main.js
          grep -F "toneMappingExposure = coarsePointer ? 0.68 : 0.82" src/main.js
          grep -F "new THREE.HemisphereLight(0xc8edff, 0x78909d, 0.72)" src/main.js
          grep -F "left:var(--safe-left);top:var(--safe-top);transform:none" src/style.css
          grep -F "backdrop-filter:none;-webkit-backdrop-filter:none" src/style.css

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/style.css
          git commit -m "Fix mobile visual clarity and HUD placement"
          git push
