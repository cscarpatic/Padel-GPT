name: Validated camera and visual refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-camera-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply camera, impact guide and seaside presentation
        shell: bash
        run: |
          cat > src/presentation.js <<'EOF'
          export function predictFirstGroundContact({ position, velocity, gravity = 9.81, radius = 0.105, maxTime = 2.5 }) {
            const a = -0.5 * gravity;
            const b = velocity.y;
            const c = position.y - radius;
            const discriminant = b * b - 4 * a * c;
            if (discriminant <= 0) return null;
            const root = Math.sqrt(discriminant);
            const candidates = [(-b - root) / (2 * a), (-b + root) / (2 * a)].filter((t) => t > 0.015 && t <= maxTime);
            if (!candidates.length) return null;
            const t = Math.max(...candidates);
            return { x: position.x + velocity.x * t, y: radius, z: position.z + velocity.z * t, time: t };
          }

          export function addSeasideArena({ THREE, scene, mat }) {
            const water = new THREE.Mesh(
              new THREE.PlaneGeometry(74, 90),
              new THREE.MeshStandardMaterial({ color: 0x4abcf2, roughness: 0.34, metalness: 0.08 })
            );
            water.rotation.x = -Math.PI / 2;
            water.position.y = -0.34;
            water.receiveShadow = true;
            scene.add(water);

            const pierMat = mat(0x875634, 0.82, 0.02);
            const goldMat = mat(0xc89b42, 0.38, 0.28);
            const whiteMat = mat(0xf4f8fb, 0.35, 0.04);
            const navyMat = mat(0x14365d, 0.32, 0.14);

            const pier = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.18, 10), pierMat);
            pier.position.set(0, 0.12, -17.2);
            pier.receiveShadow = true;
            scene.add(pier);
            for (let z = -13.2; z >= -21.2; z -= 1.35) {
              for (const x of [-1.34, 1.34]) {
                const post = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.16, 1.05, 12), pierMat);
                post.position.set(x, 0.35, z);
                const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.12, 16), goldMat);
                cap.position.set(x, 0.9, z);
                scene.add(post, cap);
              }
            }

            const makeBoat = (x, z, scale = 1) => {
              const boat = new THREE.Group();
              const hull = new THREE.Mesh(new THREE.SphereGeometry(1.05, 18, 10), whiteMat);
              hull.scale.set(1.35, 0.35, 0.52);
              hull.position.y = 0.05;
              boat.add(hull);
              const deck = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.18, 0.7), navyMat);
              deck.position.set(0, 0.31, 0);
              boat.add(deck);
              const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.7, 8), navyMat);
              mast.position.set(0.18, 1.0, 0);
              boat.add(mast);
              boat.position.set(x, -0.03, z);
              boat.scale.setScalar(scale);
              scene.add(boat);
            };
            makeBoat(-5.5, -16.6, 0.9);
            makeBoat(5.7, -18.4, 1.05);

            const sponsorCanvas = document.createElement('canvas');
            sponsorCanvas.width = 1024; sponsorCanvas.height = 128;
            const ctx = sponsorCanvas.getContext('2d');
            ctx.fillStyle = '#f8fbff'; ctx.fillRect(0, 0, 1024, 128);
            const labels = ['PADEL//NOVA', 'SEASIDE CUP', 'MARINA', 'PRO TOUR'];
            ctx.font = '700 38px system-ui, sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            labels.forEach((label, i) => {
              const x = i * 256;
              ctx.fillStyle = i % 2 ? '#eaf2ff' : '#ffffff'; ctx.fillRect(x, 0, 256, 128);
              ctx.fillStyle = i % 2 ? '#1f63e9' : '#31588e'; ctx.fillText(label, x + 128, 64);
            });
            const sponsorTexture = new THREE.CanvasTexture(sponsorCanvas);
            sponsorTexture.colorSpace = THREE.SRGBColorSpace;
            const sponsorMat = new THREE.MeshBasicMaterial({ map: sponsorTexture, toneMapped: false });
            const board = new THREE.Mesh(new THREE.PlaneGeometry(9.5, 1.18), sponsorMat);
            board.position.set(0, 0.8, -9.72);
            scene.add(board);
          }

          export function createGameplayGuides({ THREE, scene }) {
            const ringMaterial = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false, toneMapped: false });
            const playerRing = new THREE.Mesh(new THREE.RingGeometry(0.54, 0.68, 48), ringMaterial(0x39d8ff, 0.88));
            const aiRing = new THREE.Mesh(new THREE.RingGeometry(0.54, 0.68, 48), ringMaterial(0xff3f66, 0.82));
            playerRing.rotation.x = aiRing.rotation.x = -Math.PI / 2;
            playerRing.position.y = aiRing.position.y = 0.02;
            scene.add(playerRing, aiRing);

            const impact = new THREE.Group();
            const impactOuter = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.35, 40), ringMaterial(0xffe956, 0.94));
            impactOuter.rotation.x = -Math.PI / 2;
            const impactInner = new THREE.Mesh(new THREE.CircleGeometry(0.06, 28), ringMaterial(0xffffff, 0.94));
            impactInner.rotation.x = -Math.PI / 2;
            impactInner.position.y = 0.002;
            impact.add(impactOuter, impactInner);
            impact.position.y = 0.023;
            impact.visible = false;
            scene.add(impact);

            const shadowCanvas = document.createElement('canvas');
            shadowCanvas.width = shadowCanvas.height = 256;
            const ctx = shadowCanvas.getContext('2d');
            const gradient = ctx.createRadialGradient(128, 128, 18, 128, 128, 120);
            gradient.addColorStop(0, 'rgba(0,0,0,.38)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 256, 256);
            const shadowTexture = new THREE.CanvasTexture(shadowCanvas);
            const ballShadow = new THREE.Mesh(new THREE.PlaneGeometry(0.58, 0.58), new THREE.MeshBasicMaterial({ map: shadowTexture, transparent: true, opacity: 0.42, depthWrite: false }));
            ballShadow.rotation.x = -Math.PI / 2;
            ballShadow.position.y = 0.012;
            scene.add(ballShadow);

            return { playerRing, aiRing, impact, impactOuter, ballShadow };
          }

          export function updateGameplayGuides({ THREE, guides, player, ai, ball, rallyLive, hitReach, maxHitHeight, court, now, dt }) {
            if (!guides) return;
            guides.playerRing.position.set(player.pos.x, 0.02, player.pos.z);
            guides.aiRing.position.set(ai.pos.x, 0.02, ai.pos.z);

            const reachable = ball.pos.z > 0 && Math.hypot(ball.pos.x - player.pos.x, ball.pos.z - player.pos.z) < hitReach && ball.pos.y < maxHitHeight;
            guides.playerRing.material.color.setHex(reachable ? 0x83ff66 : 0x39d8ff);
            guides.playerRing.material.opacity = reachable ? 1 : 0.82;
            const pulse = 1 + Math.sin(now * 0.009) * (reachable ? 0.09 : 0.025);
            guides.playerRing.scale.setScalar(pulse);

            guides.ballShadow.position.set(ball.pos.x, 0.012, ball.pos.z);
            const shadowScale = THREE.MathUtils.clamp(1.08 - ball.pos.y * 0.1, 0.4, 1.08);
            guides.ballShadow.scale.setScalar(shadowScale);
            guides.ballShadow.material.opacity = THREE.MathUtils.clamp(0.48 - ball.pos.y * 0.055, 0.08, 0.42);

            const contact = rallyLive ? predictFirstGroundContact({ position: ball.pos, velocity: ball.vel, radius: ball.radius }) : null;
            const valid = contact && contact.z > 0.18 && contact.z < court.halfL && Math.abs(contact.x) < court.halfW;
            guides.impact.visible = !!valid;
            if (valid) {
              const target = new THREE.Vector3(contact.x, 0.023, contact.z);
              guides.impact.position.lerp(target, 1 - Math.exp(-15 * dt));
              guides.impact.rotation.y += dt * 1.8;
              const landingPulse = 1 + Math.sin(now * 0.012) * 0.08;
              guides.impact.scale.setScalar(landingPulse);
              guides.impactOuter.material.color.setHex(contact.time < 0.48 ? 0xff9f43 : 0xffe956);
            }
          }

          export function computeGameplayCamera({ THREE, cameraMode, player, ball }) {
            if (cameraMode === 0) {
              return {
                desired: new THREE.Vector3(2.4 + player.pos.x * 0.14, 7.55, player.pos.z + 8.9),
                look: new THREE.Vector3(ball.pos.x * 0.3, 1.05, ball.pos.z * 0.5)
              };
            }
            if (cameraMode === 1) {
              return { desired: new THREE.Vector3(12.7, 9.8, 13.2), look: new THREE.Vector3(0, 0.9, -0.6) };
            }
            return { desired: new THREE.Vector3(0, 17.8, 10.6), look: new THREE.Vector3(0, 0, -0.6) };
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          text = p.read_text()

          def rep(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing patch target: {label}')
              text = text.replace(old, new, 1)

          rep("import { DIFFICULTY, PLAYER_TUNING, joystickCurve } from './gameplay.js';\n", "import { DIFFICULTY, PLAYER_TUNING, joystickCurve } from './gameplay.js';\nimport { addSeasideArena, createGameplayGuides, updateGameplayGuides, computeGameplayCamera } from './presentation.js';\n", 'presentation import')
          rep("let stats = { currentRally: 0, maxRally: 0, maxSpeed: 0 };\n", "let stats = { currentRally: 0, maxRally: 0, maxSpeed: 0 };\nlet gameplayGuides = null;\nlet hitBuffer = 0;\n", 'guide state')

          text = text.replace("uniforms: { top: { value: new THREE.Color(0x1b5868) }, bottom: { value: new THREE.Color(0x020608) } }", "uniforms: { top: { value: new THREE.Color(0x82d5ff) }, bottom: { value: new THREE.Color(0xeaf8ff) } }")
          text = text.replace("ctx.fillStyle = '#185560'; ctx.fillRect(0, 0, s, s);", "ctx.fillStyle = '#1267ee'; ctx.fillRect(0, 0, s, s);")
          text = text.replace("${20 + Math.random() * 25},${95 + Math.random() * 40},${105 + Math.random() * 40}", "${22 + Math.random() * 18},${92 + Math.random() * 28},${225 + Math.random() * 30}")
          text = text.replace("rgba(255,255,255,.018)", "rgba(255,255,255,.048)")
          text = text.replace("mat(0x030709, 1)", "mat(0xd7ecf8, 1)")
          text = text.replace("mat(0x0a1518, 0.72, 0.08)", "mat(0xf4f9fc, 0.72, 0.03)")
          text = text.replace("roughness: 0.82", "roughness: 0.72", 1)
          text = text.replace("color: 0xeaf4f4", "color: 0xffffff", 1)
          text = text.replace("color: 0x9ad8df, transparent: true, opacity: 0.2", "color: 0xc9efff, transparent: true, opacity: 0.18")
          text = text.replace("transmission: 0.72", "transmission: 0.82")
          text = text.replace("rgba(176,202,205,.48)", "rgba(61,104,186,.38)")
          text = text.replace("color: 0x839397", "color: 0x4775cb")
          text = text.replace("const frameMat = mat(0x172326, 0.28, 0.82);", "const frameMat = mat(0x2464d7, 0.22, 0.56);")
          text = text.replace("const standMatA = mat(0x0d1518, 0.95); const standMatB = mat(0x121d20, 0.95);", "const standMatA = mat(0x1759dd, 0.52, 0.08); const standMatB = mat(0xf1f7fb, 0.78, 0.02);")
          text = text.replace("const spectatorMaterial = mat(0x708085, 0.9);", "const spectatorMaterial = mat(0xbac8d2, 0.88);")
          text = text.replace("scene.add(new THREE.HemisphereLight(0x9cdceb, 0x071114, 1.35));", "scene.add(new THREE.HemisphereLight(0xdaf5ff, 0xd5e6ef, 1.78));")
          text = text.replace("keyLight = new THREE.DirectionalLight(0xe8fbff, 2.55);", "keyLight = new THREE.DirectionalLight(0xffffff, 2.85);")
          text = text.replace("new THREE.MeshBasicMaterial({ color: 0xc9f5ff, toneMapped: false })", "new THREE.MeshBasicMaterial({ color: 0xf8fdff, toneMapped: false })")

          rep("  ball.mesh.castShadow = true; scene.add(ball.mesh);\n", "  ball.mesh.castShadow = true; ball.mesh.scale.setScalar(1.12); scene.add(ball.mesh);\n", 'ball scale')
          text = text.replace("opacity: 0.3, depthWrite: false", "opacity: 0.36, depthWrite: false")
          text = text.replace("Math.max(0.02, 0.3 - i * 0.022)", "Math.max(0.025, 0.36 - i * 0.024)")

          rep("    scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x07151a, 0.017);", "    scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0xd8f1fb, 0.0105);", 'bright fog')
          rep("  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.04;\n  camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 180); camera.position.set(10, 7, 14);", "  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.12;\n  camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 180); camera.position.set(5.5, 8.2, 16.5);", 'camera init')

          old_player_hit = "function playerHit() {\n  if (appMode !== 'playing' || pointLocked) return;\n  if (serveReady && getServer() === 'player') { beginServe('player'); return; }\n  if (!rallyLive || serviceActive && serviceReceiver === 'player') return;"
          new_player_hit = "function playerHit() {\n  if (appMode !== 'playing' || pointLocked) return false;\n  if (serveReady && getServer() === 'player') { beginServe('player'); return true; }\n  if (!rallyLive || serviceActive && serviceReceiver === 'player') return false;"
          rep(old_player_hit, new_player_hit, 'player hit return')
          rep("    navigator.vibrate?.(18);\n  }\n}\n\nfunction aiHit()", "    navigator.vibrate?.(18);\n    return true;\n  }\n  return false;\n}\n\nfunction aiHit()", 'player hit success return')

          old_camera = "  let desired; let look;\n  if (cameraMode === 0) { desired = new THREE.Vector3(player.pos.x * 0.22, 5.2, player.pos.z + 7.5); look = new THREE.Vector3(ball.pos.x * 0.24, 1.15, ball.pos.z * 0.42); }\n  else if (cameraMode === 1) { desired = new THREE.Vector3(11.8, 8.5, 12.5); look = new THREE.Vector3(0, 1, 0); }\n  else { desired = new THREE.Vector3(0, 16.5, 9.5); look = new THREE.Vector3(0, 0, 0); }"
          new_camera = "  const shot = computeGameplayCamera({ THREE, cameraMode, player, ball });\n  const { desired, look } = shot;"
          rep(old_camera, new_camera, 'camera modes')

          rep("    updatePlayer(dt); updateAI(dt); updateBall(dt);\n", "    if (hitBuffer > 0) { hitBuffer = Math.max(0, hitBuffer - dt); if (playerHit()) hitBuffer = 0; }\n    updatePlayer(dt); updateAI(dt); updateBall(dt);\n    updateGameplayGuides({ THREE, guides: gameplayGuides, player, ai, ball, rallyLive, hitReach: PLAYER_TUNING.hitReach, maxHitHeight: PLAYER_TUNING.maxHitHeight, court: COURT, now: performance.now(), dt });\n", 'animate guides')

          rep("  $('#touchHit').addEventListener('pointerdown', (event) => { event.preventDefault(); playerHit(); });", "  $('#touchHit').addEventListener('pointerdown', (event) => { event.preventDefault(); hitBuffer = 0.32; if (playerHit()) hitBuffer = 0; });", 'touch hit buffer')

          rep("  bootStatus.textContent = 'Costruzione arena…'; addCourt();\n  player.group = makePlayer(0xd9ff56, false); player.racket = player.group.userData.racket; player.group.position.copy(player.pos);\n  ai.group = makePlayer(0xff654f, true); ai.racket = ai.group.userData.racket; ai.group.position.copy(ai.pos); ai.group.rotation.y = Math.PI;\n  makeBall(); ball.pos.set(0, 1, 0); ball.mesh.position.copy(ball.pos); updateTrail(false); applyQuality(); setupEvents(); updateScoreUI();", "  bootStatus.textContent = 'Costruzione arena…'; addCourt(); addSeasideArena({ THREE, scene, mat });\n  player.group = makePlayer(0x30282b, false); player.racket = player.group.userData.racket; player.group.position.copy(player.pos);\n  ai.group = makePlayer(0x263b5f, true); ai.racket = ai.group.userData.racket; ai.group.position.copy(ai.pos); ai.group.rotation.y = Math.PI;\n  makeBall(); gameplayGuides = createGameplayGuides({ THREE, scene }); ball.pos.set(0, 1, 0); ball.mesh.position.copy(ball.pos); updateTrail(false); applyQuality(); setupEvents(); updateScoreUI();", 'boot presentation')

          p.write_text(text)
          PY

          cat > tests/presentation.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { predictFirstGroundContact } from '../src/presentation.js';

          test('landing prediction returns the first ground contact in front of the ball', () => {
            const hit = predictFirstGroundContact({
              position: { x: 0.4, y: 2.1, z: -2.5 },
              velocity: { x: 1.2, y: 2.5, z: 8.4 },
              radius: 0.105
            });
            assert.ok(hit);
            assert.ok(hit.time > 0);
            assert.ok(hit.z > -2.5);
            assert.ok(Number.isFinite(hit.x));
          });

          test('landing prediction rejects impossible/expired contacts', () => {
            const hit = predictFirstGroundContact({
              position: { x: 0, y: 200, z: 0 },
              velocity: { x: 0, y: 30, z: 1 },
              maxTime: 0.1
            });
            assert.equal(hit, null);
          });
          EOF

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate gameplay and production build
        run: |
          node --check src/presentation.js
          npm run check

      - name: Commit validated refresh
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/presentation.js tests/presentation.test.js
          git commit -m 'Improve camera, ball impact guidance and arena presentation'
          git push origin main
