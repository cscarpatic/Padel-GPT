name: Validated player serve receive fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/serve-receive-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/serve_receive_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate project
        run: npm run check
      - name: Validate serve receive simulation
        run: node --test tests/serve-receive.test.js
      - name: Verify dedicated receive controller
        run: |
          grep -q "AI_SERVE_RECEIVE" src/main.js
          grep -q "computeAiServeReceiveTarget" src/main.js
          grep -q "isAiServeReceivePhase" src/main.js
      - name: Commit validated update
        run: |
          git config user.name "cscarpatic"
          git config user.email "146448687+cscarpatic@users.noreply.github.com"
          git add src/main.js src/serve-receive.js tests/serve-receive.test.js
          git commit -m "Make AI reliably return player serves"
          git push
