name: Validated iOS immersive display fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-immersive-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply iOS fullscreen, zoom and visibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:100]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text)

          replace_once(
              'index.html',
              '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />',
              '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />\n  <meta name="apple-mobile-web-app-capable" content="yes" />\n  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />\n  <meta name="mobile-web-app-capable" content="yes" />'
          )

          style = Path('src/style.css')
          css = style.read_text()
          css = css.replace(
              '*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{user-select:none;-webkit-tap-highlight-color:transparent}button,select{font:inherit}',
              '*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100dvh;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}body{position:fixed;inset:0;width:100dvw;height:100dvh;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}button,select{font:inherit;touch-action:manipulation}',
              1
          )
          css = css.replace(
              '#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#05090b}',
              '#game{position:fixed;inset:0;width:100dvw;height:100dvh;display:block;touch-action:none;background:#07131d}.screen,#hud,#touch{touch-action:none}',
              1
          )
          css += '\n@supports(height:100dvh){html,body,#game,.screen,#hud{height:100dvh}}\n@media(pointer:coarse){html,body{touch-action:none}.orientation-hint{background:rgba(7,16,20,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#eef6f8}}\n'
          style.write_text(css)

          main = Path('src/main.js')
          js = main.read_text()
          js = js.replace(
              "scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0xd8f1fb, 0.0105);",
              "scene = new THREE.Scene(); scene.fog = null;",
              1
          )
          js = js.replace(
              'renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.12;',
              'renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.94;',
              1
          )
          js = js.replace(
              'bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.5, 0.92); composer.addPass(bloomPass); composer.addPass(new OutputPass());',
              'bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.14, 0.28, 0.94); composer.addPass(bloomPass); composer.addPass(new OutputPass());',
              1
          )
          js = js.replace(
              'function toggleFullscreen() {\n  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.();\n}',
              '''async function enterImmersiveMode() {\n  try {\n    if (!document.fullscreenElement) {\n      const target = document.documentElement;\n      const request = target.requestFullscreen || target.webkitRequestFullscreen;\n      if (request) await request.call(target);\n    }\n  } catch (error) {\n    console.debug('Fullscreen non disponibile su questo browser:', error);\n  }\n  try { await screen.orientation?.lock?.('landscape'); } catch {}\n  setTimeout(() => window.scrollTo(0, 1), 60);\n}\n\nfunction toggleFullscreen() {\n  if (document.fullscreenElement) document.exitFullscreen?.();\n  else enterImmersiveMode();\n}''',
              1
          )
          js = js.replace(
              "  $('#startGame').addEventListener('click', startMatch); $('#howToPlay').addEventListener('click', () => tutorial.classList.remove('hidden'));",
              "  $('#startGame').addEventListener('click', () => { enterImmersiveMode(); startMatch(); }); $('#howToPlay').addEventListener('click', () => tutorial.classList.remove('hidden'));",
              1
          )
          marker = "  document.addEventListener('visibilitychange', () => { if (document.hidden && appMode === 'playing') pauseGame(true); });\n"
          addition = marker + "\n  let lastTouchEnd = 0;\n  document.addEventListener('touchend', (event) => {\n    const now = Date.now();\n    if (now - lastTouchEnd < 320) event.preventDefault();\n    lastTouchEnd = now;\n  }, { passive: false });\n  document.addEventListener('gesturestart', (event) => event.preventDefault(), { passive: false });\n  document.addEventListener('gesturechange', (event) => event.preventDefault(), { passive: false });\n  document.addEventListener('gestureend', (event) => event.preventDefault(), { passive: false });\n  document.addEventListener('dblclick', (event) => event.preventDefault(), { passive: false });\n"
          if marker not in js:
              raise SystemExit('visibilitychange marker not found')
          js = js.replace(marker, addition, 1)
          main.write_text(js)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate syntax, tests and production build
        run: npm run check

      - name: Verify mobile fixes
        run: |
          grep -q 'maximum-scale=1' index.html
          grep -q 'apple-mobile-web-app-capable' index.html
          grep -q 'scene.fog = null' src/main.js
          grep -q 'toneMappingExposure = 0.94' src/main.js
          grep -q "gesturestart" src/main.js
          grep -q '100dvh' src/style.css

      - name: Commit validated mobile fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/main.js src/style.css
          git commit -m 'Fix iOS visibility, fullscreen and touch zoom' || exit 0
          git push origin main
