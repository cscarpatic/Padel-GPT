name: Validated no-lob CPU serve update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/no-lob-cpu-serve.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/no_lob_serve_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate project
        run: npm run check
      - name: Validate dedicated serve tests
        run: node --test tests/service.test.js
      - name: Verify CPU path is dedicated
        run: |
          grep -q "flatCpuServePoint" src/main.js
          grep -q "cpuServeFlight" src/main.js
          grep -q "startCpuFlatServe" src/main.js
      - name: Commit validated update
        run: |
          git config user.name "cscarpatic"
          git config user.email "146448687+cscarpatic@users.noreply.github.com"
          git add src/main.js src/service.js tests/service.test.js
          git commit -m "Replace CPU serve lob with dedicated flat trajectory"
          git push
